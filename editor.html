<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRICHE — Sketch-Editor</title>
<style>
  :root { --ink:#111; --blood:#e0122b; --blue:#1466d6; --line:#e5e5e5; --panel:#fafafa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  .toolbar { display:flex; align-items:center; gap:14px; padding:8px 14px; border-bottom:3px solid var(--ink); flex:none; }
  .toolbar .brand { font-weight:900; font-size:20px; letter-spacing:-.03em; }
  .toolbar button, .toolbar label.btn { font:inherit; font-weight:700; border:none; background:none; cursor:pointer; color:var(--ink); padding:4px 6px; }
  .toolbar button:hover { color:var(--blood); }
  .toolbar .sep { width:1px; height:20px; background:var(--line); }
  .toolbar input[type=text] { font:inherit; border:none; border-bottom:2px solid var(--line); padding:2px 4px; }
  .toolbar input[type=number] { width:52px; font:inherit; border:1px solid var(--line); padding:2px 4px; }
  .toolbar .spacer { flex:1; }
  .toggle { display:inline-flex; align-items:center; gap:6px; font-weight:700; cursor:pointer; }
  .toggle .dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); }
  .toggle.on .dot { background:var(--blood); border-color:var(--blood); }

  .main { flex:1; display:grid; grid-template-columns:190px 1fr 230px; min-height:0; }
  .panel { border-right:1px solid var(--line); overflow:auto; padding:10px; }
  .panel.right { border-right:none; border-left:1px solid var(--line); }
  .panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#999; margin:14px 0 6px; }
  .panel h3:first-child { margin-top:0; }

  .add-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .add-grid button { font:inherit; font-size:12px; font-weight:700; border:1px solid var(--line); background:#fff; border-radius:5px; padding:6px 4px; cursor:pointer; }
  .add-grid button:hover { border-color:var(--blood); color:var(--blood); }

  .objlist { list-style:none; margin:0; padding:0; }
  .objlist li { display:flex; align-items:center; gap:4px; padding:5px 6px; border-radius:5px; cursor:pointer; font-size:13px; }
  .objlist li.sel { background:var(--blood); color:#fff; }
  .objlist li .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .objlist li button { border:none; background:none; cursor:pointer; color:inherit; font-size:12px; opacity:.7; }
  .objlist li button:hover { opacity:1; }

  .stagewrap { position:relative; display:flex; align-items:center; justify-content:center; background:#f4f4f4; min-height:0; padding:16px; }
  .stagebox { position:relative; width:100%; max-width:760px; aspect-ratio:16/9; background:#fff; border:3px solid var(--ink); }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #stage line, #stage circle, #stage path, #stage ellipse, #stage rect { stroke-width:4; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
  #stage .sk-head { fill:#fff; } #stage .sk-dot { fill:var(--ink); stroke:none; } #stage text { font-weight:900; }
  .selbox { position:absolute; border:1.5px dashed var(--blood); pointer-events:none; display:none; }

  #handles { position:absolute; inset:0; pointer-events:none; }
  .gz { position:absolute; pointer-events:auto; display:none; }
  .gz.limb { width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; background:#fff; border:2px solid var(--blood); cursor:grab; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .gz.rot { width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--blue); border:2px solid #fff; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .gz.scale { width:13px; height:13px; margin:-6.5px 0 0 -6.5px; background:var(--ink); border:2px solid #fff; cursor:nwse-resize; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .stagetip { position:absolute; bottom:2px; left:0; right:0; text-align:center; font-size:11px; color:#bbb; pointer-events:none; }

  .quick { display:flex; gap:5px; margin:0 0 12px; }
  .quick button { flex:1; font:inherit; font-size:11px; font-weight:700; border:1px solid var(--line); background:#fff; border-radius:5px; padding:6px 2px; cursor:pointer; }
  .quick button:hover { border-color:var(--blood); color:var(--blood); }
  .bigbtn { width:100%; font:inherit; font-weight:700; border:1px solid var(--ink); background:#fff; border-radius:6px; padding:8px; cursor:pointer; margin-bottom:6px; }
  .bigbtn:hover { background:var(--ink); color:#fff; }
  .prop { margin-bottom:7px; }
  .prop label { display:block; font-size:11px; color:#888; margin-bottom:2px; }
  .prop input, .prop select { width:100%; font:inherit; font-size:13px; border:1px solid var(--line); padding:3px 5px; border-radius:4px; }
  details.fine { margin-top:10px; }
  details.fine summary { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#999; cursor:pointer; }
  .chan { display:grid; grid-template-columns:44px 1fr 40px auto; gap:4px; align-items:center; margin:6px 0 4px; }
  .chan .cname { font-size:11px; color:#888; }
  .chan input.sld { width:100%; accent-color:var(--blood); }
  .chan input.val { font:inherit; font-size:12px; border:1px solid var(--line); padding:2px 3px; border-radius:4px; width:100%; }
  .chan input.val.haskey { border-color:var(--blood); }
  .chan select.ez { font-size:10px; border:1px solid var(--line); border-radius:4px; padding:1px; max-width:64px; }

  .timeline { flex:none; height:120px; border-top:3px solid var(--ink); display:flex; flex-direction:column; background:var(--panel); }
  .tl-top { display:flex; align-items:center; gap:14px; padding:7px 14px; border-bottom:1px solid var(--line); }
  .tl-top button { font:inherit; font-weight:700; border:none; background:none; cursor:pointer; font-size:15px; }
  .tl-top button:hover { color:var(--blood); }
  .tl-top .oname { color:#aaa; font-weight:700; }
  .tl-top .tip { margin-left:auto; font-size:11px; color:#bbb; }
  .tl-body { flex:1; position:relative; }
  .ruler { position:relative; height:20px; border-bottom:1px solid var(--line); background:#fff; cursor:pointer; user-select:none; }
  .ruler .tick { position:absolute; top:0; height:100%; border-left:1px solid #eee; font-size:9px; color:#bbb; padding-left:3px; }
  .lane { position:absolute; left:0; right:0; top:20px; bottom:0; cursor:pointer; }
  .kf { position:absolute; top:50%; width:13px; height:13px; margin:-6.5px 0 0 -6.5px; background:#fff; border:2px solid var(--ink); transform:rotate(45deg); cursor:ew-resize; }
  .kf:hover { border-color:var(--blood); }
  .kf.sel { background:var(--blood); border-color:var(--blood); }
  .playhead { position:absolute; top:0; bottom:0; width:2px; background:var(--blood); z-index:5; pointer-events:none; }
  .empty { color:#bbb; font-size:12px; padding:14px; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="brand">STRICHE · Editor</span>
    <button id="btnNew">Neu</button>
    <label class="btn" style="cursor:pointer;">Import<input type="file" id="imp" accept=".2dsk,.json" style="display:none;"></label>
    <button id="btnExport">Export .2dsk</button>
    <div class="sep"></div>
    <button id="btnPlay">▶ Play</button>
    <span class="sep"></span>
    <label style="font-size:12px;color:#888;">Titel</label>
    <input type="text" id="title" value="Neuer Sketch">
    <label style="font-size:12px;color:#888;">Dauer</label>
    <input type="number" id="dur" min="0.5" max="60" step="0.5" value="5">
    <div class="spacer"></div>
    <div class="toggle on" id="autokey" title="Änderungen setzen automatisch Keyframes"><span class="dot"></span>Auto-Key</div>
    <a href="player.html" style="color:#888;font-weight:700;text-decoration:none;">→ Player</a>
  </div>

  <div class="main">
    <div class="panel">
      <h3>Hinzufügen</h3>
      <div class="add-grid" id="addGrid"></div>
      <h3>Objekte</h3>
      <ul class="objlist" id="objlist"></ul>
    </div>

    <div class="stagewrap">
      <div class="stagebox" id="stagebox">
        <svg id="stage" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="selbox" id="selbox"></div>
        <div id="handles"></div>
      </div>
      <div class="stagetip">ziehen: Körper = bewegen · <span style="color:var(--blue)">blau</span> = drehen · <span style="color:#000">schwarz</span> = Größe · <span style="color:var(--blood)">rot</span> = Hand/Fuß</div>
    </div>

    <div class="panel right" id="props">
      <p class="empty">Objekt links hinzufügen oder auf der Bühne anklicken.</p>
    </div>
  </div>

  <div class="timeline">
    <div class="tl-top">
      <button id="btnPlay2">▶</button>
      <span id="timeread" style="font-weight:700;color:#888;">0.00s</span>
      <span class="oname" id="oname"></span>
      <span class="tip">Keyframe ziehen = Zeit ändern · klicken = anspringen · Entf = löschen</span>
    </div>
    <div class="tl-body">
      <div class="ruler" id="ruler"></div>
      <div class="lane" id="lane"></div>
      <div class="playhead" id="playhead" style="left:12px;"></div>
    </div>
  </div>

<script src="sketch-engine.js"></script>
<script>
(function(){
  const E = SketchEngine;
  const svg = document.getElementById('stage');
  const stagebox = document.getElementById('stagebox');
  const renderer = new E.Renderer(svg);
  let doc = E.defaultDoc();
  let time = 0, selId = null, selTime = null, autoKey = true, playing = false, raf = null, last = 0;

  const CH_COMMON = ['x','y','rot','sx','sy','op'];
  const CH_STICK = ['armL','armR','legL','legR'];
  const LABEL = { x:'X', y:'Y', rot:'Dreh°', sx:'Breite', sy:'Höhe', op:'Sicht', armL:'Arm L', armR:'Arm R', legL:'Bein L', legR:'Bein R' };
  const RANGE = { x:[0,800,1], y:[0,450,1], rot:[-180,180,1], sx:[0,2,0.01], sy:[0,2,0.01], op:[0,1,0.01], armL:[-180,180,1], armR:[-180,180,1], legL:[-180,180,1], legR:[-180,180,1] };
  const PAD = 12;

  function sel(){ return doc.objects.find(o=>o.id===selId) || null; }
  function chansFor(o){ return o.type==='stickman' ? CH_COMMON.concat(CH_STICK) : CH_COMMON; }

  function setKey(o, ch, t, v, e){
    o.keys[ch] = o.keys[ch] || [];
    const arr = o.keys[ch];
    const hit = arr.find(k=>Math.abs(k.t-t)<1e-3);
    if(hit){ hit.v=v; if(e) hit.e=e; }
    else arr.push({ t:+(+t).toFixed(3), v, e: e||'ease-in-out' });
    arr.sort((a,b)=>a.t-b.t);
  }
  function editChannel(o, ch, v){
    if(autoKey) setKey(o, ch, time, v, easeAtOrBefore(o,ch,time));
    else if(o.keys[ch] && o.keys[ch].length) setKey(o, ch, time, v);
    else o.props[ch] = v;
  }
  function easeAtOrBefore(o,ch,t){ const arr=o.keys[ch]; if(!arr) return 'ease-in-out'; let e='ease-in-out'; for(const k of arr){ if(k.t<=t+1e-3) e=k.e; } return e; }
  function snapshotPose(o){ chansFor(o).forEach(ch=> setKey(o,ch,time,E.channelValue(o,ch,time), easeAtOrBefore(o,ch,time))); }

  function quickAction(o, q){
    const t=time, D=doc.duration, before=Math.max(0,t-0.18), after=Math.min(D,t+0.16);
    if(q==='appear'){
      setKey(o,'op',before,0,'linear'); setKey(o,'op',t,1,'back');
      setKey(o,'sx',before,0.2,'linear'); setKey(o,'sx',t,1.12,'back'); setKey(o,'sx',after,1,'ease-out');
      setKey(o,'sy',before,0.2,'linear'); setKey(o,'sy',t,1.12,'back'); setKey(o,'sy',after,1,'ease-out');
    } else if(q==='vanish'){
      setKey(o,'op',t,1,'ease-in'); setKey(o,'op',Math.min(D,t+0.18),0,'ease-in');
      setKey(o,'sy',t,1,'ease-in'); setKey(o,'sy',Math.min(D,t+0.18),0.2,'ease-in');
    } else if(q==='pop'){
      setKey(o,'sx',t,0.6,'ease-out'); setKey(o,'sx',Math.min(D,t+0.08),1.2,'back'); setKey(o,'sx',Math.min(D,t+0.2),1,'ease-out');
      setKey(o,'sy',t,0.6,'ease-out'); setKey(o,'sy',Math.min(D,t+0.08),1.2,'back'); setKey(o,'sy',Math.min(D,t+0.2),1,'ease-out');
    }
  }

  function svgPt(x,y){ const p=svg.createSVGPoint(); p.x=x; p.y=y; return p; }
  function localToClient(g,x,y){ const m=g.getScreenCTM(); return m ? svgPt(x,y).matrixTransform(m) : null; }
  function clientToLocal(g,cx,cy){ const m=g.getScreenCTM(); return m ? svgPt(cx,cy).matrixTransform(m.inverse()) : null; }

  /* ---------- Render ---------- */
  function rebuild(){ renderer.load(doc); refresh(); }
  function refresh(){ renderer.render(time); drawSel(); drawGizmo(); }
  function drawSel(){
    const box=document.getElementById('selbox'); const o=sel();
    if(!o){ box.style.display='none'; return; }
    const h=renderer.handleFor(o.id); if(!h){ box.style.display='none'; return; }
    const gr=h.g.getBoundingClientRect(), cr=stagebox.getBoundingClientRect();
    if(gr.width<1 && gr.height<1){ box.style.display='none'; return; }
    box.style.display='block';
    box.style.left=(gr.left-cr.left-4)+'px'; box.style.top=(gr.top-cr.top-4)+'px';
    box.style.width=(gr.width+8)+'px'; box.style.height=(gr.height+8)+'px';
  }

  /* ---------- Gizmo (Ziehgriffe auf der Bühne) ---------- */
  const GZ = {};
  function setupHandles(){
    const c=document.getElementById('handles');
    // Dreh- und Größe-Griff (für alle Objekte)
    GZ.rot=mkHandle(c,'gz rot','drehen'); GZ.scale=mkHandle(c,'gz scale','Größe / stauchen');
    GZ.rot.onpointerdown=(e)=>startRotate(e);
    GZ.scale.onpointerdown=(e)=>startScale(e);
    // Gliedmaßen (nur Figur)
    ['armL','armR','legL','legR'].forEach(limb=>{ const d=mkHandle(c,'gz limb',(limb[0]==='a'?'Hand':'Fuß')+' ziehen'); GZ[limb]=d;
      d.onpointerdown=(e)=>startLimb(e,limb); });
  }
  function mkHandle(c,cls,title){ const d=document.createElement('div'); d.className=cls; d.title=title; c.appendChild(d); return d; }
  function center(h){ const r=h.g.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2, r }; }
  function drag(onMove){ const move=(ev)=>onMove(ev); const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); renderLane(); renderProps(); }; document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); }

  function startRotate(e){ e.preventDefault(); e.stopPropagation(); const o=sel(); if(!o) return; const h=renderer.handleFor(o.id); if(!h) return;
    const c=center(h); const a0=Math.atan2(e.clientY-c.y,e.clientX-c.x); const rot0=E.channelValue(o,'rot',time);
    drag((ev)=>{ const a=Math.atan2(ev.clientY-c.y,ev.clientX-c.x); editChannel(o,'rot',Math.round(rot0+(a-a0)*180/Math.PI)); refresh(); });
  }
  function startScale(e){ e.preventDefault(); e.stopPropagation(); const o=sel(); if(!o) return; const h=renderer.handleFor(o.id); if(!h) return;
    const c=center(h); const dx0=(e.clientX-c.x)||1, dy0=(e.clientY-c.y)||1; const sx0=E.channelValue(o,'sx',time), sy0=E.channelValue(o,'sy',time);
    drag((ev)=>{ const sx=Math.max(0.05,Math.abs(sx0*((ev.clientX-c.x)/dx0))), sy=Math.max(0.05,Math.abs(sy0*((ev.clientY-c.y)/dy0)));
      editChannel(o,'sx',+sx.toFixed(2)); editChannel(o,'sy',+sy.toFixed(2)); refresh(); });
  }
  function startLimb(e,limb){ e.preventDefault(); e.stopPropagation(); const o=sel(); if(!o||o.type!=='stickman') return; const h=renderer.handleFor(o.id); if(!h) return;
    const joint = limb[0]==='a' ? [0,-42] : [0,0];
    drag((ev)=>{ const loc=clientToLocal(h.g,ev.clientX,ev.clientY); if(!loc) return; editChannel(o,limb,Math.round(Math.atan2(loc.x-joint[0],loc.y-joint[1])*180/Math.PI)); refresh(); });
  }
  function drawGizmo(){
    const o=sel(); const on=!!o; ['rot','scale','armL','armR','legL','legR'].forEach(k=>{ if(GZ[k]) GZ[k].style.display='none'; });
    if(!on) return;
    const h=renderer.handleFor(o.id); if(!h) return;
    const r=h.g.getBoundingClientRect(), cr=stagebox.getBoundingClientRect();
    if(r.width<2 && r.height<2) return;
    GZ.rot.style.display='block'; GZ.rot.style.left=(r.left+r.width/2-cr.left)+'px'; GZ.rot.style.top=(r.top-cr.top-18)+'px';
    GZ.scale.style.display='block'; GZ.scale.style.left=(r.right-cr.left)+'px'; GZ.scale.style.top=(r.bottom-cr.top)+'px';
    if(o.type==='stickman'){ ['armL','armR','legL','legR'].forEach(l=>{ const ln=h.parts[l]; if(!ln) return; const c=localToClient(h.g,+ln.getAttribute('x2'),+ln.getAttribute('y2')); if(!c) return; GZ[l].style.display='block'; GZ[l].style.left=(c.x-cr.left)+'px'; GZ[l].style.top=(c.y-cr.top)+'px'; }); }
  }

  /* ---------- Objektliste ---------- */
  function renderList(){
    const ul=document.getElementById('objlist'); ul.innerHTML='';
    doc.objects.forEach((o,i)=>{
      const li=document.createElement('li'); if(o.id===selId) li.className='sel';
      li.innerHTML=`<span class="nm">${o.type}</span><button data-a="up">▲</button><button data-a="dn">▼</button><button data-a="del">✕</button>`;
      li.onclick=(e)=>{ if(e.target.tagName!=='BUTTON'){ selId=o.id; selTime=null; renderAll(); } };
      li.querySelectorAll('button').forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); const a=b.dataset.a;
        if(a==='del'){ doc.objects.splice(i,1); if(selId===o.id) selId=null; }
        if(a==='up'&&i>0){ doc.objects.splice(i-1,0,doc.objects.splice(i,1)[0]); }
        if(a==='dn'&&i<doc.objects.length-1){ doc.objects.splice(i+1,0,doc.objects.splice(i,1)[0]); }
        rebuild(); renderAll(); });
      ul.appendChild(li);
    });
  }

  /* ---------- Eigenschaften ---------- */
  function renderProps(){
    const el=document.getElementById('props'); const o=sel();
    if(!o){ el.innerHTML='<p class="empty">Objekt links hinzufügen oder auf der Bühne anklicken.</p>'; return; }
    const p=o.props;
    const inp=(l,id,v,t)=>`<div class="prop"><label>${l}</label><input id="${id}" type="${t||'text'}" value="${v==null?'':v}"></div>`;
    const sb=(l,id,v,opts)=>`<div class="prop"><label>${l}</label><select id="${id}">${opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></div>`;
    let html=`<h3>${o.type}</h3>`;
    html+=`<div class="quick"><button data-q="appear" title="erscheint ab hier">✨ erscheint</button><button data-q="pop">⤢ Pop</button><button data-q="vanish" title="verschwindet ab hier">💨 weg</button></div>`;
    html+=`<button class="bigbtn" id="snap">◆ Pose als Keyframe (${time.toFixed(2)}s)</button>`;
    if(o.type==='text'){ html+=inp('Text','p_text',p.text)+inp('Größe','p_size',p.size||24,'number')+`<div class="prop"><label>Farbe</label><input id="p_fill" type="color" value="${p.fill||'#111111'}"></div>`; }
    if(o.type==='stickman'){ html+=sb('Augen','p_eyes',p.eyes||'dots',['dots','x','none'])+sb('Mund','p_mouth',p.mouth||'line',['line','smile','frown','o','none'])+`<div class="prop"><label>Farbe</label><input id="p_stroke" type="color" value="${p.stroke||'#111111'}"></div>`; }
    if(o.type==='splat'){ html+=inp('Radius','p_r',p.r||40,'number')+inp('Spitzen','p_n',p.n||12,'number')+`<div class="prop"><label>Farbe</label><input id="p_color" type="color" value="${p.color||'#e0122b'}"></div>`; }
    if(o.type==='circle'){ html+=inp('Radius','p_r',p.r==null?20:p.r,'number')+`<div class="prop"><label>Kontur</label><input id="p_stroke" type="color" value="${p.stroke||'#111111'}"></div>`; }
    if(o.type==='rect'){ html+=inp('Breite','p_w',p.w||60,'number')+inp('Höhe','p_h',p.h||40,'number')+`<div class="prop"><label>Kontur</label><input id="p_stroke" type="color" value="${p.stroke||'#111111'}"></div>`; }
    if(o.type==='line'){ html+=inp('Länge x','p_x2',p.x2==null?40:p.x2,'number')+`<div class="prop"><label>Farbe</label><input id="p_stroke" type="color" value="${p.stroke||'#111111'}"></div>`; }

    // Feinwerte (eingeklappt)
    html+=`<details class="fine"><summary>Feinwerte</summary>`;
    chansFor(o).forEach(ch=>{ const v=E.channelValue(o,ch,time), has=o.keys[ch]&&o.keys[ch].length, r=RANGE[ch];
      html+=`<div class="chan"><span class="cname">${LABEL[ch]}</span>
        <input type="range" class="sld" data-ch="${ch}" min="${r[0]}" max="${r[1]}" step="${r[2]}" value="${+v}">
        <input class="val ${has?'haskey':''}" data-ch="${ch}" value="${(+v).toFixed(1)}">
        <select class="ez" data-ch="${ch}" title="Übergang">${E.EASING_NAMES.map(n=>`<option ${n===easeAtOrBefore(o,ch,time)?'selected':''}>${n}</option>`).join('')}</select>
      </div>`; });
    html+=`</details>`;
    el.innerHTML=html;

    el.querySelector('#snap').onclick=()=>{ snapshotPose(o); renderLane(); renderProps(); };
    el.querySelectorAll('.quick button').forEach(b=> b.onclick=()=>{ quickAction(o,b.dataset.q); rebuild(); renderLane(); renderProps(); });
    const bind=(id,fn)=>{ const e=document.getElementById(id); if(e){ e.oninput=()=>{ fn(e.value); rebuild(); }; e.onchange=()=>{ fn(e.value); rebuild(); renderProps(); }; } };
    bind('p_text',v=>p.text=v); bind('p_size',v=>p.size=+v); bind('p_fill',v=>p.fill=v); bind('p_stroke',v=>p.stroke=v); bind('p_color',v=>p.color=v);
    bind('p_eyes',v=>p.eyes=v); bind('p_mouth',v=>p.mouth=v); bind('p_r',v=>p.r=+v); bind('p_n',v=>p.n=+v);
    bind('p_x2',v=>p.x2=+v); bind('p_w',v=>p.w=+v); bind('p_h',v=>p.h=+v);
    el.querySelectorAll('input.sld').forEach(s=>{ s.oninput=()=>{ editChannel(o,s.dataset.ch,+s.value); const vi=el.querySelector('input.val[data-ch="'+s.dataset.ch+'"]'); if(vi){ vi.value=(+s.value).toFixed(1); vi.classList.add('haskey'); } refresh(); }; s.onchange=()=>{ renderLane(); renderProps(); }; });
    el.querySelectorAll('input.val').forEach(i=> i.onchange=()=>{ editChannel(o,i.dataset.ch,+i.value); rebuild(); renderLane(); renderProps(); });
    el.querySelectorAll('select.ez').forEach(s=> s.onchange=()=>{ const ch=s.dataset.ch, arr=o.keys[ch]; if(arr){ let tg=null; for(const k of arr){ if(k.t<=time+1e-3) tg=k; } if(tg){ tg.e=s.value; refresh(); } } });
  }

  /* ---------- Timeline (eine Spur) ---------- */
  function laneWidth(){ return document.getElementById('ruler').clientWidth - 2*PAD; }
  function t2x(t){ return PAD + (t/doc.duration)*laneWidth(); }
  function x2t(x){ return Math.max(0, Math.min(doc.duration, ((x-PAD)/laneWidth())*doc.duration)); }
  function positionPlayhead(){ document.getElementById('playhead').style.left=t2x(time)+'px'; }

  function renderRuler(){ const r=document.getElementById('ruler'); r.innerHTML=''; const step=doc.duration<=6?1:2;
    for(let t=0;t<=doc.duration+1e-6;t+=step){ const d=document.createElement('div'); d.className='tick'; d.style.left=t2x(t)+'px'; d.textContent=t+'s'; r.appendChild(d); } }

  function columnTimes(o){ const set=new Set(); chansFor(o).forEach(ch=>(o.keys[ch]||[]).forEach(k=> set.add(+k.t.toFixed(3)))); return [...set].sort((a,b)=>a-b); }
  function moveColumn(o,told,tnew){ chansFor(o).forEach(ch=>{ const arr=o.keys[ch]; if(!arr) return; arr.forEach(k=>{ if(Math.abs(k.t-told)<1e-3) k.t=+(+tnew).toFixed(3); }); arr.sort((a,b)=>a.t-b.t); }); }
  function deleteColumn(o,t){ chansFor(o).forEach(ch=>{ if(o.keys[ch]){ o.keys[ch]=o.keys[ch].filter(k=>Math.abs(k.t-t)>=1e-3); if(!o.keys[ch].length) delete o.keys[ch]; } }); }

  function renderLane(){
    const lane=document.getElementById('lane'); lane.innerHTML='';
    const o=sel(); document.getElementById('oname').textContent = o? o.type : '';
    if(!o){ positionPlayhead(); return; }
    columnTimes(o).forEach(t=>{
      const dot=document.createElement('div'); dot.className='kf'+((selTime!=null&&Math.abs(selTime-t)<1e-3)?' sel':''); dot.style.left=(t2x(t)-PAD)+'px';
      let moved=false, startX=0, cur=t;
      dot.onpointerdown=(e)=>{ e.preventDefault(); e.stopPropagation(); selTime=t; renderLane(); startX=e.clientX; moved=false;
        const move=(ev)=>{ if(Math.abs(ev.clientX-startX)>2) moved=true; const rr=document.getElementById('ruler').getBoundingClientRect(); const nt=x2t(ev.clientX-rr.left); moveColumn(o,cur,nt); cur=nt; selTime=nt; dot.style.left=(t2x(nt)-PAD)+'px'; refresh(); };
        const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); if(!moved){ setTime(cur); } else { renderLane(); } renderProps(); };
        document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
      };
      lane.appendChild(dot);
    });
    positionPlayhead();
  }

  (function(){ const r=document.getElementById('ruler'), lane=document.getElementById('lane');
    const scrub=(e)=>{ const rect=r.getBoundingClientRect(); setTime(x2t(e.clientX-rect.left)); };
    const down=(e)=>{ pause(); scrub(e); const mv=(ev)=>scrub(ev); const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);}; document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up); };
    r.onpointerdown=down; lane.onpointerdown=(e)=>{ if(e.target===lane) down(e); };
  })();

  function setTime(t){ time=Math.max(0,Math.min(doc.duration,t)); refresh(); positionPlayhead(); document.getElementById('timeread').textContent=time.toFixed(2)+'s'; renderProps(); }

  /* ---------- Canvas: Körper ziehen = bewegen ---------- */
  svg.addEventListener('pointerdown',(e)=>{
    const g=e.target.closest('[data-id]'); if(!g) return;
    selId=g.getAttribute('data-id'); selTime=null; renderAll();
    const o=sel(); if(!o) return;
    const rect=svg.getBoundingClientRect(); const sxr=doc.viewBox[2]/rect.width, syr=doc.viewBox[3]/rect.height;
    const sX=e.clientX, sY=e.clientY, bx=E.channelValue(o,'x',time), by=E.channelValue(o,'y',time);
    const move=(ev)=>{ editChannel(o,'x',+(bx+(ev.clientX-sX)*sxr).toFixed(1)); editChannel(o,'y',+(by+(ev.clientY-sY)*syr).toFixed(1)); refresh(); };
    const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); renderLane(); renderProps(); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });

  /* ---------- Play ---------- */
  function loop(now){ if(!playing) return; const dt=(now-last)/1000; last=now; let nt=time+dt; if(nt>=doc.duration) nt=0; setTime(nt); raf=requestAnimationFrame(loop); }
  function play(){ playing=true; document.getElementById('btnPlay').textContent='❚❚ Pause'; document.getElementById('btnPlay2').textContent='❚❚'; last=performance.now(); raf=requestAnimationFrame(loop); }
  function pause(){ playing=false; document.getElementById('btnPlay').textContent='▶ Play'; document.getElementById('btnPlay2').textContent='▶'; if(raf) cancelAnimationFrame(raf); }
  document.getElementById('btnPlay').onclick=()=>playing?pause():play();
  document.getElementById('btnPlay2').onclick=()=>playing?pause():play();

  /* ---------- Toolbar ---------- */
  function buildAddGrid(){ const g=document.getElementById('addGrid'); g.innerHTML='';
    E.PRESET_LIST.forEach(pr=>{ const b=document.createElement('button'); b.textContent=pr.label; b.onclick=()=>{ const o=E.makePreset(pr.key,400,pr.key==='strichmann'?341:225); doc.objects.push(o); selId=o.id; selTime=null; rebuild(); renderAll(); }; g.appendChild(b); }); }
  document.getElementById('autokey').onclick=function(){ autoKey=!autoKey; this.classList.toggle('on',autoKey); };
  document.getElementById('title').oninput=function(){ doc.title=this.value; };
  document.getElementById('dur').onchange=function(){ doc.duration=Math.max(0.5,+this.value||5); renderRuler(); renderLane(); positionPlayhead(); };
  document.getElementById('btnNew').onclick=()=>{ if(confirm('Neuen Sketch anlegen? Nicht Gespeichertes geht verloren.')){ doc=E.defaultDoc(); time=0; selId=null; selTime=null; document.getElementById('title').value=doc.title; document.getElementById('dur').value=doc.duration; rebuild(); renderRuler(); renderAll(); } };
  document.getElementById('btnExport').onclick=()=>{ doc.objects.forEach(o=>{ for(const ch in o.keys) if(o.keys[ch]) o.keys[ch].sort((a,b)=>a.t-b.t); });
    const blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(doc.title||'sketch').replace(/\s+/g,'_')+'.2dsk'; a.click(); };
  document.getElementById('imp').onchange=function(){ const f=this.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ doc=E.validate(JSON.parse(r.result)); time=0; selId=null; selTime=null; document.getElementById('title').value=doc.title||''; document.getElementById('dur').value=doc.duration; rebuild(); renderRuler(); renderAll(); }catch(err){ alert('Import fehlgeschlagen: '+err.message); } }; r.readAsText(f); this.value=''; };

  document.addEventListener('keydown',(e)=>{
    if(/input|select|textarea/i.test(document.activeElement.tagName)) return;
    if(e.key===' '){ e.preventDefault(); playing?pause():play(); }
    else if(e.key==='ArrowLeft'){ setTime(time-0.05); }
    else if(e.key==='ArrowRight'){ setTime(time+0.05); }
    else if(e.key==='Delete'||e.key==='Backspace'){
      const o=sel();
      if(o && selTime!=null){ deleteColumn(o,selTime); selTime=null; rebuild(); renderLane(); renderProps(); }
      else if(selId){ const i=doc.objects.findIndex(x=>x.id===selId); if(i>=0){ doc.objects.splice(i,1); selId=null; rebuild(); renderAll(); } }
    }
  });

  function renderAll(){ renderList(); renderProps(); renderLane(); drawSel(); drawGizmo(); }

  // Init
  buildAddGrid(); setupHandles();
  rebuild(); renderRuler(); renderAll(); positionPlayhead();
  window.addEventListener('resize', ()=>{ renderRuler(); renderLane(); positionPlayhead(); refresh(); });

  window.__editor = { getDoc:()=>doc, load:(d)=>{ doc=E.validate(d); selId=null; selTime=null; time=0; document.getElementById('title').value=doc.title||''; document.getElementById('dur').value=doc.duration; rebuild(); renderRuler(); renderAll(); }, setTime };
})();
</script>
</body>
</html>
